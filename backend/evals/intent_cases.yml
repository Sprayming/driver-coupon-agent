# 意图分类评测集：只评「一句话 → 主意图」，不跑完整 chat 链路。
# 被 evals/intent_bakeoff.py 加载；标签必须与 api/schemas.py 的 Intent 枚举一致。
# 版本约定：改动题目（增删改）必须升 version，旧版本保留，保证跨版本指标可比。
# tags 只用于诊断，不参与评分：
#   keyword    强关键词，规则应命中
#   paraphrase 口语/同义，规则容易漏
#   negation   否定句，规则容易反判
#   multi      复合诉求（同时出现两个业务词）
#   collision  关键词跨意图冲突
#   boundary   信息不足或与业务无关

version: v1
description: 意图分类 v1，56 条中文司机口语样本（自建，非盲测）

cases:
  # —— refund_request（退款/退卡） ——
  - case_id: refund-01
    user_message: "我要退款"
    expected_intent: refund_request
    tags: [keyword]
  - case_id: refund-02
    user_message: "这张卡券能退吗？"
    expected_intent: refund_request
    tags: [keyword]
  - case_id: refund-03
    user_message: "我不想要了，钱退给我"
    expected_intent: refund_request
    tags: [paraphrase]
  - case_id: refund-04
    user_message: "这张券我不想要了，能退吗？"
    expected_intent: refund_request
    tags: [multi, collision]
  - case_id: refund-05
    user_message: "买错了，帮我取消一下"
    expected_intent: refund_request
    tags: [paraphrase]
  - case_id: refund-06
    user_message: "卡券退款多久到账？"
    expected_intent: refund_request
    tags: [keyword]
  - case_id: refund-07
    user_message: "临时有事去不了，能退卡吗？"
    expected_intent: refund_request
    tags: [keyword, paraphrase]
  - case_id: refund-08
    user_message: "这个卡券用不了，退了吧"
    expected_intent: refund_request
    tags: [paraphrase]
  - case_id: refund-09
